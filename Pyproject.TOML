[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "loan-decision-explainer"
version = "0.1.0"
description = "Explains individual loan approval/denial decisions: exact from-scratch Shapley values, counterfactual 'what would change the outcome' suggestions, and a plain-language adverse-action-style report"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]


[project.scripts]
decision-explainer = "decision_explainer.cli:cli"


[tool.setuptools.packages.find]
where = ["src"]